name: PR Check

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@v7

      - name: 🔧 Build
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - run: |
          pnpm install
          pnpm run lint
          pnpm run build
